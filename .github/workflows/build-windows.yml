name: Build Caesium Windows x64
run-name: Caesium ${{ inputs.source_ref }} / ${{ inputs.build_mode }} (#${{ github.run_number }})

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Official main, version tag, or full commit SHA reachable from main'
        required: true
        default: main
        type: string
      build_mode:
        description: 'Preserve upstream locks or apply reviewed Rust and compatible npm security fixes'
        required: true
        default: upstream
        type: choice
        options:
          - upstream
          - security-patched
      node_version:
        description: 'Node.js version (tested exact default; 26.x for newer 26 releases)'
        required: true
        default: '26.13.1'
        type: string
      rust_version:
        description: 'Rust version (tested exact default; stable for newest stable)'
        required: true
        default: '1.100.0'
        type: string
      rust_audit_policy:
        description: 'Report RustSec findings or block on known Rust vulnerabilities'
        required: true
        default: block
        type: choice
        options:
          - report
          - block

permissions:
  contents: read

concurrency:
  group: caesium-windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 75
    outputs:
      installer_id: ${{ steps.upload.outputs.artifact-id }}
      installer_sha: ${{ steps.stage.outputs.installer_sha }}
      manifest_sha: ${{ steps.stage.outputs.manifest_sha }}
      source_sha: ${{ steps.source.outputs.sha }}
      producer_attempt: ${{ steps.stage.outputs.producer_attempt }}
    defaults:
      run:
        shell: pwsh
        working-directory: upstream
    env:
      CARGO_TERM_COLOR: never
      NO_COLOR: '1'
      CI: 'true'
      BUILD_MODE: ${{ inputs.build_mode }}
      SOURCE_REF: ${{ inputs.source_ref }}
      NODE_REQUESTED: ${{ inputs.node_version }}
      RUST_REQUESTED: ${{ inputs.rust_version }}
      RUST_AUDIT_POLICY: ${{ inputs.rust_audit_policy }}
    steps:
      - name: Validate build inputs
        working-directory: ${{ github.workspace }}
        run: |
          if ($env:SOURCE_REF -cnotmatch '^(main|[0-9a-fA-F]{40}|v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.]+)?)$') { throw 'Use main, a full commit SHA, or an official version tag' }
          if ($env:NODE_REQUESTED -cnotmatch '^[0-9]+\.(?:x|[0-9]+\.[0-9]+)$') { throw 'Use an exact Node version or a major.x selector' }
          if ($env:RUST_REQUESTED -cnotmatch '^(stable|[0-9]+\.[0-9]+\.[0-9]+)$') { throw 'Use stable or an exact Rust version' }
          if ($env:BUILD_MODE -notin @('upstream','security-patched') -or $env:RUST_AUDIT_POLICY -notin @('report','block')) { throw 'Invalid build policy' }
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-record'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          [ordered]@{source_ref=$env:SOURCE_REF;build_mode=$env:BUILD_MODE;node_requested=$env:NODE_REQUESTED;rust_requested=$env:RUST_REQUESTED;rust_audit_policy=$env:RUST_AUDIT_POLICY;workflow_sha=$env:GITHUB_SHA;runner_os=$env:RUNNER_OS;runner_arch=$env:RUNNER_ARCH;runner_image=$env:ImageOS;runner_image_version=$env:ImageVersion} | ConvertTo-Json | Set-Content "$out/build-inputs.json"

      - name: Check out trusted build helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: controls
          persist-credentials: false

      - name: Test payload verifier before compilation
        working-directory: ${{ github.workspace }}
        run: |
          python controls/scripts/verify_payload.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Payload verifier self-tests failed' }
          python controls/scripts/patch_rust.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Rust remediation self-tests failed' }

      - name: Check out official source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Lymphatus/caesium-v3
          ref: ${{ inputs.source_ref }}
          path: upstream
          persist-credentials: false
          fetch-depth: 0

      - name: Record source identity
        id: source
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[0-9a-f]{40}$') { throw 'Cannot resolve source commit' }
          if ($env:SOURCE_REF -match '^v') {
            $tagCommit = git rev-parse "refs/tags/$($env:SOURCE_REF)^{commit}"
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $sha) { throw 'Official tag does not resolve to checked-out commit' }
          } else {
            git merge-base --is-ancestor $sha refs/remotes/origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Commit is not reachable from official upstream main' }
            if ($env:SOURCE_REF -ne 'main' -and $env:SOURCE_REF -ne $sha) { throw 'Requested commit mismatch' }
          }
          $tauri = Get-Content api/tauri.conf.json -Raw | ConvertFrom-Json
          $version = $tauri.version
          if ($tauri.identifier -ne 'com.saerasoft.caesium' -or $tauri.mainBinaryName -ne 'Caesium Image Compressor') { throw 'Upstream application identity changed; review installer compatibility' }
          if ($version -notmatch '^[0-9A-Za-z.+-]+$') { throw 'Invalid app version' }
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -ne $version) { throw 'Application version mismatch' }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "short=$($sha.Substring(0,12))" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-record'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          "Official source: https://github.com/Lymphatus/caesium-v3/tree/$sha`nCommit: $sha`nVersion: $version`nTarget: x86_64-pc-windows-msvc`nBuild: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Set-Content "$out/source.txt"
          git log -1 --format=fuller | Add-Content "$out/source.txt"
          Get-FileHash package-lock.json,Cargo.lock -Algorithm SHA256 | Format-List | Out-File "$out/lockfile-hashes.txt"
          if ($env:BUILD_MODE -notin @('upstream','security-patched')) { throw 'Invalid build mode' }
          "Build mode: $env:BUILD_MODE" | Add-Content "$out/source.txt"
          Copy-Item package-lock.json "$out/package-lock.upstream.json"
          Copy-Item package.json "$out/package.upstream.json"
          Copy-Item LICENSE.md "$out/UPSTREAM-LICENSE.md"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
          architecture: x64
          package-manager-cache: false

      - name: Install Rust and NASM
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = "$env:RUST_REQUESTED-x86_64-pc-windows-msvc"
          rustup toolchain install $toolchain --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust install failed' }
          $env:RUSTUP_TOOLCHAIN = $toolchain
          "RUSTUP_TOOLCHAIN=$toolchain" | Add-Content $env:GITHUB_ENV
          if (-not (Get-Command nasm.exe -ErrorAction SilentlyContinue)) {
            choco install nasm --yes --no-progress
            if ($LASTEXITCODE -notin @(0,1641,3010)) { throw 'NASM installation failed' }
            $env:Path += ';' + [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User') + ';C:\ProgramData\chocolatey\bin;C:\Program Files\NASM;C:\Program Files (x86)\NASM'
          }
          $nasm = (Get-Command nasm.exe -ErrorAction Stop).Source
          Split-Path $nasm -Parent | Add-Content $env:GITHUB_PATH
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-record'
          & {
            node --version
            npm.cmd --version
            rustc --version --verbose
            cargo --version
            & $nasm -v
            git --version
          } | Tee-Object "$out/toolchain.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Toolchain discovery failed' }
          $actualNode = (node --version).TrimStart('v')
          if ($env:NODE_REQUESTED -notmatch '\.x$' -and $actualNode -ne $env:NODE_REQUESTED) { throw 'Node version mismatch' }
          $actualRust = (rustc --version).Split(' ')[1]
          if ($env:RUST_REQUESTED -ne 'stable' -and $actualRust -ne $env:RUST_REQUESTED) { throw 'Rust version mismatch' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -all -products '*' -format json | Set-Content "$out/visual-studio.json"
          if ($LASTEXITCODE -ne 0) { throw 'Visual Studio discovery failed' }

      - name: Audit original Rust lockfile (RustSec)
        if: inputs.build_mode == 'security-patched'
        working-directory: ${{ github.workspace }}
        run: |
          & ./controls/scripts/audit_rust.ps1 -LockFile './upstream/Cargo.lock' -OutputDirectory './build-record/rust-upstream' -Policy report
          exit 0

      - name: Apply reviewed Rust security updates
        working-directory: ${{ github.workspace }}
        run: |
          python controls/scripts/patch_rust.py --root upstream --out build-record --mode $env:BUILD_MODE
          if ($LASTEXITCODE -ne 0) { throw 'Rust lockfile remediation failed' }

      - name: Audit effective Rust dependencies (RustSec)
        working-directory: ${{ github.workspace }}
        run: |
          & ./controls/scripts/audit_rust.ps1 -LockFile './upstream/Cargo.lock' -OutputDirectory './build-record' -Policy $env:RUST_AUDIT_POLICY
          $report = Get-Content './build-record/cargo-audit.json' -Raw | ConvertFrom-Json
          if ($env:BUILD_MODE -eq 'security-patched' -and @($report.vulnerabilities.list | Where-Object { $_.advisory.id -in @('RUSTSEC-2026-0592','RUSTSEC-2026-0594') }).Count -gt 0) { throw 'Reviewed Rust vulnerabilities remain; installer blocked' }
          exit 0

      - name: Audit original dependency lockfile
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-record'
          function Invoke-DependencyAudit {
            param([string]$Label, [string[]]$Extra)
            $auditArgs = @('audit','--json','--audit-level=low') + $Extra
            & npm.cmd @auditArgs 1> "$out/$Label.json" 2> "$out/$Label-stderr.log"
            $code = $LASTEXITCODE
            "npm audit exit code: $code" | Set-Content "$out/$Label-status.txt"
            $report = Get-Content "$out/$Label.json" -Raw | ConvertFrom-Json -ErrorAction Stop
            if ($report.error -or $null -eq $report.metadata.vulnerabilities.total -or $code -notin @(0,1)) { throw "Audit unavailable or invalid: $Label (exit $code)" }
            $v = $report.metadata.vulnerabilities
            $total = [int]$v.total
            if (($total -gt 0 -and $code -eq 0) -or ($total -eq 0 -and $code -ne 0)) { throw "Inconsistent audit status: $Label" }
            $line = "| $Label | $($v.info) | $($v.low) | $($v.moderate) | $($v.high) | $($v.critical) | $total |"
            $line | Add-Content $env:GITHUB_STEP_SUMMARY
            Write-Host $line
            return $total
          }
          @('### npm dependency audit','| Report | Info | Low | Moderate | High | Critical | Total |','|---|---:|---:|---:|---:|---:|---:|') | Add-Content $env:GITHUB_STEP_SUMMARY
          $full = Invoke-DependencyAudit -Label 'npm-audit-upstream-full' -Extra @('--package-lock-only','--include=dev')
          $prod = Invoke-DependencyAudit -Label 'npm-audit-upstream-production' -Extra @('--package-lock-only','--omit=dev')
          if ($full -gt 0 -or $prod -gt 0) { Write-Warning 'Upstream dependency findings detected.' }
          exit 0

      - name: Apply opt-in compatible npm fixes
        if: inputs.build_mode == 'security-patched'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-record'
          $baseline = Get-Content "$out/npm-audit-upstream-full.json" -Raw | ConvertFrom-Json
          if ([int]$baseline.metadata.vulnerabilities.total -gt 0) {
            npm.cmd audit fix --package-lock-only --ignore-scripts --no-force --json --audit-level=low 1> "$out/npm-audit-fix.json" 2> "$out/npm-audit-fix-stderr.log"
            $code = $LASTEXITCODE
            "npm audit fix exit code: $code" | Set-Content "$out/npm-audit-fix-status.txt"
            if ($code -notin @(0,1)) { throw "npm audit fix failed: $code" }
            $fix = Get-Content "$out/npm-audit-fix.json" -Raw | ConvertFrom-Json -ErrorAction Stop
            if ($fix.error) { throw 'npm audit fix reported an error' }
          } else {
            'No known findings in initial full audit; no remediation needed.' | Set-Content "$out/npm-audit-fix-status.txt"
          }
          git diff --exit-code -- package.json
          if ($LASTEXITCODE -ne 0) { throw 'npm remediation modified package.json; manual review required' }
          $rustPatch = Get-Content "$out/rust-remediation.json" -Raw | ConvertFrom-Json
          if ((Get-FileHash Cargo.lock -Algorithm SHA256).Hash -ne $rustPatch.effective_sha256) { throw 'npm remediation altered effective Rust lockfile' }
          git diff --binary --output="$out/npm-lockfile-changes.patch" -- package-lock.json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot record npm lockfile diff' }
          exit 0

      - name: Record effective dependency lockfiles
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-record'
          if ($env:BUILD_MODE -eq 'upstream') {
            git diff --exit-code -- package.json package-lock.json Cargo.lock
            if ($LASTEXITCODE -ne 0) { throw 'Upstream dependency files changed' }
          }
          Copy-Item package-lock.json "$out/package-lock.effective.json"
          $rustPatch = Get-Content "$out/rust-remediation.json" -Raw | ConvertFrom-Json
          if ((Get-FileHash Cargo.lock -Algorithm SHA256).Hash -ne $rustPatch.effective_sha256) { throw 'Effective Rust lockfile mismatch' }
          Copy-Item Cargo.lock "$out/Cargo.lock"
          Get-FileHash package.json,package-lock.json,Cargo.lock -Algorithm SHA256 | Select-Object Path,Hash | ConvertTo-Json | Set-Content "$out/effective-lockfile-hashes.json"
          exit 0

      - name: Verify patched lockfile audit before installation
        if: inputs.build_mode == 'security-patched'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-record'
          function Invoke-DependencyAudit {
            param([string]$Label, [string[]]$Extra)
            $auditArgs = @('audit','--json','--audit-level=low') + $Extra
            & npm.cmd @auditArgs 1> "$out/$Label.json" 2> "$out/$Label-stderr.log"
            $code = $LASTEXITCODE
            "npm audit exit code: $code" | Set-Content "$out/$Label-status.txt"
            $report = Get-Content "$out/$Label.json" -Raw | ConvertFrom-Json -ErrorAction Stop
            if ($report.error -or $null -eq $report.metadata.vulnerabilities.total -or $code -notin @(0,1)) { throw "Audit unavailable or invalid: $Label (exit $code)" }
            $v = $report.metadata.vulnerabilities
            $total = [int]$v.total
            if (($total -gt 0 -and $code -eq 0) -or ($total -eq 0 -and $code -ne 0)) { throw "Inconsistent audit status: $Label" }
            $line = "| $Label | $($v.info) | $($v.low) | $($v.moderate) | $($v.high) | $($v.critical) | $total |"
            $line | Add-Content $env:GITHUB_STEP_SUMMARY
            Write-Host $line
            return $total
          }
          @('### npm dependency audit','| Report | Info | Low | Moderate | High | Critical | Total |','|---|---:|---:|---:|---:|---:|---:|') | Add-Content $env:GITHUB_STEP_SUMMARY
          $full = Invoke-DependencyAudit -Label 'npm-audit-patched-lock-full' -Extra @('--package-lock-only','--include=dev')
          $prod = Invoke-DependencyAudit -Label 'npm-audit-patched-lock-production' -Extra @('--package-lock-only','--omit=dev')
          if ($full -gt 0 -or $prod -gt 0) { throw 'Known npm findings remain; patched installer blocked. Review diagnostics.' }
          exit 0

      - name: Install locked dependencies
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-record'
          npm.cmd ci --no-audit --include=dev 2>&1 | Tee-Object "$out/npm-ci.log"
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          cargo fetch --locked --target x86_64-pc-windows-msvc 2>&1 | Tee-Object "$out/cargo-fetch.log"
          if ($LASTEXITCODE -ne 0) { throw 'cargo fetch failed' }

      - name: Audit installed dependency tree
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-record'
          function Invoke-DependencyAudit {
            param([string]$Label, [string[]]$Extra)
            $auditArgs = @('audit','--json','--audit-level=low') + $Extra
            & npm.cmd @auditArgs 1> "$out/$Label.json" 2> "$out/$Label-stderr.log"
            $code = $LASTEXITCODE
            "npm audit exit code: $code" | Set-Content "$out/$Label-status.txt"
            $report = Get-Content "$out/$Label.json" -Raw | ConvertFrom-Json -ErrorAction Stop
            if ($report.error -or $null -eq $report.metadata.vulnerabilities.total -or $code -notin @(0,1)) { throw "Audit unavailable or invalid: $Label (exit $code)" }
            $v = $report.metadata.vulnerabilities
            $total = [int]$v.total
            if (($total -gt 0 -and $code -eq 0) -or ($total -eq 0 -and $code -ne 0)) { throw "Inconsistent audit status: $Label" }
            $line = "| $Label | $($v.info) | $($v.low) | $($v.moderate) | $($v.high) | $($v.critical) | $total |"
            $line | Add-Content $env:GITHUB_STEP_SUMMARY
            Write-Host $line
            return $total
          }
          @('### npm dependency audit','| Report | Info | Low | Moderate | High | Critical | Total |','|---|---:|---:|---:|---:|---:|---:|') | Add-Content $env:GITHUB_STEP_SUMMARY
          $full = Invoke-DependencyAudit -Label 'npm-audit-final-full' -Extra @('--include=dev')
          $prod = Invoke-DependencyAudit -Label 'npm-audit-final-production' -Extra @('--omit=dev')
          if ($full -gt 0 -or $prod -gt 0) {
            if ($env:BUILD_MODE -eq 'security-patched') { throw 'Known npm findings remain; patched installer blocked.' }
            Write-Warning 'Upstream build has npm audit findings; review reports before use.'
          }
          exit 0

      - name: Record dependency inventories
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-record'
          npm.cmd sbom --sbom-format cyclonedx --package-lock-only 1> "$out/npm-sbom.cdx.json" 2> "$out/npm-sbom-stderr.log"
          if ($LASTEXITCODE -ne 0) { throw 'npm SBOM generation failed' }
          $sbom = Get-Content "$out/npm-sbom.cdx.json" -Raw | ConvertFrom-Json
          if ($sbom.bomFormat -ne 'CycloneDX' -or !$sbom.components) { throw 'Invalid npm SBOM' }
          cargo metadata --locked --format-version 1 --filter-platform x86_64-pc-windows-msvc 1> "$out/cargo-metadata-windows.json" 2> "$out/cargo-metadata-stderr.log"
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }

      - name: Type-check frontend
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-record'
          npm.cmd run check 2>&1 | Tee-Object "$out/typecheck.log"
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript checks failed' }

      - name: Build unsigned Windows installer
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-record'
          $config = Join-Path $env:RUNNER_TEMP 'caesium-local-build.json'
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content $config -Encoding utf8NoBOM
          Copy-Item $config "$out/build-config.json"
          npm.cmd run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis --config $config -- --locked 2>&1 | Tee-Object "$out/compiler.log"
          if ($LASTEXITCODE -ne 0) { throw 'Tauri build failed' }
          git diff --exit-code -- package.json
          if ($LASTEXITCODE -ne 0) { throw 'Source manifest changed' }
          $expected = Get-Content "$out/effective-lockfile-hashes.json" -Raw | ConvertFrom-Json
          foreach ($entry in $expected) {
            if ((Get-FileHash -LiteralPath $entry.Path -Algorithm SHA256).Hash -ne $entry.Hash) { throw "Dependency file changed after lockfile capture: $($entry.Path)" }
          }
          if ($env:BUILD_MODE -eq 'upstream') {
            git diff --exit-code -- package-lock.json Cargo.lock
            if ($LASTEXITCODE -ne 0) { throw 'Upstream dependency lockfile changed' }
          }
          $compiled = Get-Item -LiteralPath 'target/x86_64-pc-windows-msvc/release/Caesium Image Compressor.exe'
          (Get-FileHash -LiteralPath $compiled.FullName -Algorithm SHA256).Hash | Set-Content "$out/pre-test-exe-sha256.txt"
          exit 0

      - name: Run upstream Rust regression tests
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-record'
          cargo test --locked --release --workspace --lib --target x86_64-pc-windows-msvc 2>&1 | Tee-Object "$out/rust-tests.log"
          if ($LASTEXITCODE -ne 0) { throw 'Rust regression tests failed' }
          $results = Select-String -Path "$out/rust-tests.log" -Pattern 'test result:'
          if (!$results -or -not ($results.Line -match 'test result: ok\. [1-9][0-9]* passed; 0 failed;')) { throw 'No nonempty successful Rust test suite found' }
          "### Rust regression tests" | Add-Content $env:GITHUB_STEP_SUMMARY
          $results.Line | ForEach-Object { "- $_" | Add-Content $env:GITHUB_STEP_SUMMARY }
          $expected = Get-Content "$out/effective-lockfile-hashes.json" -Raw | ConvertFrom-Json
          foreach ($entry in $expected) {
            if ((Get-FileHash -LiteralPath $entry.Path -Algorithm SHA256).Hash -ne $entry.Hash) { throw "Dependency file changed during tests: $($entry.Path)" }
          }
          $allowed = @('tsconfig.node.tsbuildinfo')
          if ($env:BUILD_MODE -eq 'security-patched') { $allowed += @('package-lock.json','Cargo.lock') }
          $changed = @(git diff --name-only HEAD)
          if ($LASTEXITCODE -ne 0 -or @($changed | Where-Object { $_ -notin $allowed }).Count -gt 0) { throw 'Unexpected tracked source modifications after build/tests' }

      - name: Verify and stage installer
        id: stage
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis -File -Filter '*setup.exe')
          if ($files.Count -ne 1) { throw "Expected exactly one installer, got $($files.Count)" }
          $file = $files[0]
          if ($file.Length -lt 1024) { throw 'Installer unexpectedly small' }
          $dest = Join-Path $env:GITHUB_WORKSPACE 'installer'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item -LiteralPath $file.FullName -Destination $dest
          $copy = Get-Item (Join-Path $dest $file.Name)
          $hash = (Get-FileHash -LiteralPath $copy.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'Installer copy hash mismatch' }
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-record'
          $binary = Get-Item -LiteralPath 'target/x86_64-pc-windows-msvc/release/Caesium Image Compressor.exe'
          $binaryHash = (Get-FileHash -LiteralPath $binary.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($binaryHash -ne (Get-Content "$out/pre-test-exe-sha256.txt" -Raw).Trim()) { throw 'Compiled executable changed during regression tests' }
          $seven = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (!$seven) { $seven = Join-Path $env:ProgramFiles '7-Zip/7z.exe' }
          if (!(Test-Path -LiteralPath $seven)) { throw '7-Zip unavailable for installer verification' }
          $unpack = Join-Path $env:RUNNER_TEMP 'caesium-nsis-verify'
          New-Item -ItemType Directory -Path $unpack -Force | Out-Null
          & $seven x -y "-o$unpack" $copy.FullName 2>&1 | Tee-Object "$out/installer-extraction.log"
          if ($LASTEXITCODE -ne 0) { throw 'NSIS extraction failed' }
          $embedded = @(Get-ChildItem -LiteralPath $unpack -Recurse -File | Where-Object Name -eq $binary.Name)
          if ($embedded.Count -ne 1) { throw 'Expected one embedded application executable' }
          $verifier = Join-Path $env:GITHUB_WORKSPACE 'controls/scripts/verify_payload.py'
          python $verifier --compiled $binary.FullName --embedded $embedded[0].FullName 1> "$out/installer-payload-verification.json" 2> "$out/installer-payload-verification-stderr.log"
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$out/installer-payload-verification-stderr.log" | Write-Host
            throw 'Installer payload verification failed'
          }
          $payload = Get-Content "$out/installer-payload-verification.json" -Raw | ConvertFrom-Json
          if ($payload.compiled_sha256 -ne $binaryHash -or $payload.embedded_sha256 -ne (Get-FileHash -LiteralPath $embedded[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'Verifier hash cross-check failed' }
          $embeddedHash = $payload.embedded_sha256
          $expectedHash = $payload.expected_embedded_sha256
          $comparison = $payload.comparison
          $markerOffset = $payload.marker_offset
          "$hash  $($copy.Name)" | Set-Content "$dest/SHA256SUMS.txt"
          "$embeddedHash  $($binary.Name)" | Set-Content "$dest/INSTALLED-EXE-SHA256.txt"
          $rust = Get-Content "$out/cargo-audit-status.json" -Raw | ConvertFrom-Json
          $npmFull = Get-Content "$out/npm-audit-final-full.json" -Raw | ConvertFrom-Json
          $npmProd = Get-Content "$out/npm-audit-final-production.json" -Raw | ConvertFrom-Json
          Copy-Item LICENSE.md "$dest/UPSTREAM-LICENSE.md"
          Copy-Item "$env:GITHUB_WORKSPACE/build-record/source.txt" "$dest/source.txt"
          Copy-Item "$env:GITHUB_WORKSPACE/build-record/effective-lockfile-hashes.json" "$dest/effective-lockfile-hashes.json"
          Copy-Item "$out/npm-audit-final-full.json","$out/npm-audit-final-production.json","$out/cargo-audit.json","$out/cargo-audit-status.json","$out/installer-payload-verification.json","$out/rust-remediation.json","$out/Cargo.lock.upstream","$out/Cargo.lock.effective" $dest
          $support = @(Get-ChildItem -LiteralPath $dest -File | Where-Object Name -ne $copy.Name | Sort-Object Name | ForEach-Object {
            @{name=$_.Name;size_bytes=$_.Length;sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
          })
          $manifest = [ordered]@{
            schema_version=3; app_version='${{ steps.source.outputs.version }}'; source_repository='Lymphatus/caesium-v3'; source_commit='${{ steps.source.outputs.sha }}'; build_mode=$env:BUILD_MODE; workflow_commit=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID; run_attempt=$env:GITHUB_RUN_ATTEMPT; target='x86_64-pc-windows-msvc'
            installer=@{name=$copy.Name;size_bytes=$copy.Length;sha256=$hash}
            executable=@{name=$binary.Name;size_bytes=$embedded[0].Length;sha256=$embeddedHash;compiled_sha256=$binaryHash;expected_embedded_sha256=$expectedHash;comparison=$comparison;marker_offset=$markerOffset;embedded_hash_verified=$true}
            dependency_files=@(Get-Content "$out/effective-lockfile-hashes.json" -Raw | ConvertFrom-Json | ForEach-Object { @{name=[IO.Path]::GetFileName($_.Path);sha256=$_.Hash.ToLowerInvariant()} })
            supporting_files=$support
            npm_full_findings=[int]$npmFull.metadata.vulnerabilities.total; npm_production_findings=[int]$npmProd.metadata.vulnerabilities.total; rust_audit=$rust; rust_tests='passed'; signed_by_upstream=$false
          }
          $manifest | ConvertTo-Json -Depth 12 | Set-Content "$dest/build-manifest.json"
          Copy-Item "$dest/build-manifest.json" "$out/build-manifest.json"
          "installer_sha=$hash" >> $env:GITHUB_OUTPUT
          "manifest_sha=$((Get-FileHash "$dest/build-manifest.json" -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "producer_attempt=$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
          "- Installed executable SHA-256: $embeddedHash (verified: $comparison)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Build mode: $env:BUILD_MODE" | Add-Content $env:GITHUB_STEP_SUMMARY
          "### Unofficial Caesium Windows x64 build`n- Source: ${{ steps.source.outputs.sha }}`n- Version: ${{ steps.source.outputs.version }}`n- Installer: $($copy.Name)`n- SHA-256: $hash`n- Unsigned; review audit report before installing." | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload installer
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Caesium-${{ steps.source.outputs.version }}-${{ steps.source.outputs.short }}-${{ inputs.build_mode }}-windows-x64-run${{ github.run_id }}-a${{ github.run_attempt }}
          path: installer/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-record/
          if-no-files-found: warn
          retention-days: 90

  attest:
    name: Independently verify and attest build
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download exact installer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.installer_id }}
          path: verified
          digest-mismatch: error

      - name: Verify hashes and build identity without executing artifact
        env:
          EXPECTED_INSTALLER_SHA: ${{ needs.build.outputs.installer_sha }}
          EXPECTED_MANIFEST_SHA: ${{ needs.build.outputs.manifest_sha }}
          EXPECTED_MODE: ${{ inputs.build_mode }}
          EXPECTED_RUST_POLICY: ${{ inputs.rust_audit_policy }}
          EXPECTED_SOURCE: ${{ needs.build.outputs.source_sha }}
          EXPECTED_ATTEMPT: ${{ needs.build.outputs.producer_attempt }}
        run: |
          python -I -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("verified")
          manifests = list(root.rglob("build-manifest.json"))
          assert len(manifests) == 1, "Expected one manifest"
          manifest = manifests[0]
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest(manifest) == os.environ["EXPECTED_MANIFEST_SHA"]
          data = json.loads(manifest.read_text(encoding="utf-8-sig"))
          files = list(root.rglob("*setup.exe"))
          assert len(files) == 1
          exe = files[0]
          assert exe.name == data["installer"]["name"]
          assert exe.stat().st_size == data["installer"]["size_bytes"]
          assert digest(exe) == data["installer"]["sha256"] == os.environ["EXPECTED_INSTALLER_SHA"]
          assert data["workflow_commit"] == os.environ["GITHUB_SHA"]
          assert str(data["run_id"]) == os.environ["GITHUB_RUN_ID"]
          assert data["build_mode"] == os.environ["EXPECTED_MODE"]
          assert data["rust_audit"]["policy"] == os.environ["EXPECTED_RUST_POLICY"]
          assert data["source_commit"] == os.environ["EXPECTED_SOURCE"]
          assert str(data["run_attempt"]) == os.environ["EXPECTED_ATTEMPT"]
          assert data["schema_version"] == 3
          supporting = data["supporting_files"]
          names = [record["name"] for record in supporting]
          assert len(names) == len(set(names))
          assert set(names) == {"SHA256SUMS.txt", "INSTALLED-EXE-SHA256.txt", "UPSTREAM-LICENSE.md", "source.txt", "effective-lockfile-hashes.json", "npm-audit-final-full.json", "npm-audit-final-production.json", "cargo-audit.json", "cargo-audit-status.json", "installer-payload-verification.json", "rust-remediation.json", "Cargo.lock.upstream", "Cargo.lock.effective"}
          assert {p.name for p in manifest.parent.iterdir() if p.is_file()} == set(names) | {manifest.name, exe.name}
          for record in supporting:
              support = manifest.parent / record["name"]
              assert support.is_file()
              assert support.stat().st_size == record["size_bytes"]
              assert digest(support) == record["sha256"]
          assert data["target"] == "x86_64-pc-windows-msvc"
          assert data["source_repository"] == "Lymphatus/caesium-v3"
          assert data["rust_tests"] == "passed"
          assert data["signed_by_upstream"] is False
          for label, field in (("full", "npm_full_findings"), ("production", "npm_production_findings")):
              audit = json.loads((manifest.parent / f"npm-audit-final-{label}.json").read_text(encoding="utf-8-sig"))
              assert "error" not in audit
              assert audit["metadata"]["vulnerabilities"]["total"] == data[field]
          rust = json.loads((manifest.parent / "cargo-audit.json").read_text(encoding="utf-8-sig"))
          assert rust["vulnerabilities"]["count"] == data["rust_audit"]["vulnerabilities"]
          payload = json.loads((manifest.parent / "installer-payload-verification.json").read_text(encoding="utf-8-sig"))
          assert payload["embedded_sha256"] == data["executable"]["sha256"]
          assert payload["compiled_sha256"] == data["executable"]["compiled_sha256"]
          assert payload["comparison"] == data["executable"]["comparison"]
          assert payload["expected_embedded_sha256"] == data["executable"]["expected_embedded_sha256"]
          assert payload["marker_offset"] == data["executable"]["marker_offset"]
          assert payload["embedded_size"] == data["executable"]["size_bytes"]
          rust_status = json.loads((manifest.parent / "cargo-audit-status.json").read_text(encoding="utf-8-sig"))
          assert rust_status == data["rust_audit"]
          remediation = json.loads((manifest.parent / "rust-remediation.json").read_text(encoding="utf-8-sig"))
          assert remediation["mode"] == data["build_mode"]
          assert remediation["unrelated_package_changes"] == 0
          assert remediation["upstream_sha256"] == digest(manifest.parent / "Cargo.lock.upstream")
          assert remediation["effective_sha256"] == digest(manifest.parent / "Cargo.lock.effective")
          assert remediation["effective_sha256"] == next(x["sha256"] for x in data["dependency_files"] if x["name"] == "Cargo.lock")
          if data["build_mode"] == "upstream":
              assert not remediation["changes"]
              assert remediation["effective_sha256"] == remediation["upstream_sha256"]
          else:
              assert not any(x["advisory"]["id"] in ("RUSTSEC-2026-0592", "RUSTSEC-2026-0594") for x in rust["vulnerabilities"]["list"])
              approved = {("cookie", "0.18.2", "0.18.3", "RUSTSEC-2026-0594"), ("url", "2.5.8", "2.5.9", "RUSTSEC-2026-0592")}
              assert all((x["name"], x["from"], x["to"], x["advisory"]) in approved for x in remediation["changes"])
          assert data["executable"]["embedded_hash_verified"] is True
          assert data["executable"]["sha256"] == data["executable"]["expected_embedded_sha256"]
          assert data["executable"]["comparison"] in ("exact", "tauri-nsis-marker")
          if data["executable"]["comparison"] == "exact":
              assert data["executable"]["sha256"] == data["executable"]["compiled_sha256"]
          else:
              assert isinstance(data["executable"]["marker_offset"], int)
              assert data["executable"]["marker_offset"] >= 0
          if data["build_mode"] == "security-patched":
              assert data["npm_full_findings"] == data["npm_production_findings"] == 0
          if data["rust_audit"]["policy"] == "block":
              assert data["rust_audit"]["vulnerabilities"] == 0
          print("Installer bytes, manifest, run identity and security policy verified.")
          PY

      - name: Attest installer and build manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            verified/**/*setup.exe
            verified/**/build-manifest.json
          create-storage-record: false
